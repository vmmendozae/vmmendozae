name: Estadísticas del perfil

on:
  schedule:
    - cron: "0 11 * * *" # todos los días, 6:00 a. m. hora de Colombia
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar stats.svg (incluye repos privados)
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python scripts/stats.py stats.svg
      - name: Guardar si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git diff --cached --quiet || (git commit -m "Actualizar estadísticas del perfil" && git push)
