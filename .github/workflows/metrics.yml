name: Estadísticas del perfil

on:
  schedule:
    - cron: "0 11 * * *" # todos los días, 6:00 a. m. hora de Colombia
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "Actualizar estadísticas del perfil"
          user: vmmendozae
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Bogota
          config_display: large
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, shell, dockerfile, makefile
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
